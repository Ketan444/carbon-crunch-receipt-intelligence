name: Carbon Crunch CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install project dependencies
        run: |
          python -m pip install numpy>=1.24,<2.4
          python -m pip install opencv-python-headless>=4.5
          python -m pip install Pillow>=9.0
          python -m pip install paddlepaddle==3.0.0
          python -m pip install paddleocr==3.5.0
          python -m pip install pydantic>=2.0
          python -m pip install PyYAML==6.0.2

      - name: Install test and quality tools
        run: |
          python -m pip install pytest ruff black

      - name: Validate Python syntax
        run: |
          python -m compileall -q src scripts tests

      - name: Run tests
        run: |
          python -m pytest tests/ -v

      - name: Run Ruff
        run: |
          ruff check src/ scripts/ tests/

      - name: Run Black
        run: |
          black --check src/ scripts/ tests/